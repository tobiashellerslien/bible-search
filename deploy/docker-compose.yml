services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  bible-search:
    image: ghcr.io/tobiashellerslien/bible-search:latest
    container_name: bible-search
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DB_DIR}:/data
    environment:
      - FLASK_ENV=production
      - BIBLE_DB_PATH=/data/bible.db
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-search.rule=Host(`${BIBELSOK_DOMAIN}`)
      - traefik.http.routers.bible-search.entrypoints=web
      - traefik.http.services.bible-search.loadbalancer.server.port=8421
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
    command: bible-search
