services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  bible-search:
    image: ghcr.io/tobiashellerslien/bible-search:latest
    container_name: bible-search
    restart: unless-stopped
    volumes:
      - ${DB_DIR}:/data
    environment:
      - FLASK_ENV=production
      - BIBLE_DB_PATH=/data/bible.db
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-search.rule=Host(`${BIBELSOK_DOMAIN}`)
      - traefik.http.routers.bible-search.entrypoints=websecure
      - traefik.http.routers.bible-search.tls.certresolver=letsencrypt
      - traefik.http.services.bible-search.loadbalancer.server.port=8421
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
    command: bible-search

volumes:
  letsencrypt:
